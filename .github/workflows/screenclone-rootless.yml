name: Build ScreenClone rootless deb

on:
  workflow_dispatch:
  push:
    paths:
      - "ScreenClone/**"
      - ".github/workflows/screenclone-rootless.yml"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          brew install ldid xz
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install iOS SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"

      - name: Build rootless package
        working-directory: ScreenClone
        run: make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: ScreenClone-rootless
          path: ScreenClone/packages/*.deb

